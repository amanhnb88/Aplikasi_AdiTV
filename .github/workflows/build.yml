name: Build Android APK (Turbo & Quiet)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: ☕ Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: 📦 Install Dependencies (Yarn)
        # --no-immutable digunakan agar GitHub bisa update yarn.lock otomatis saat ada library baru
        run: yarn install --no-immutable

      - name: ⚡ Aktifkan Gradle Configuration Cache
        # Optimasi sesuai dokumentasi yang kamu kirim
        run: echo "org.gradle.configuration-cache=true" >> android/gradle.properties

      - name: 🔓 Make Gradlew Executable
        run: cd android && chmod +x ./gradlew

      - name: 🛠️ Build Release APK (Turbo Mode)
        # -q (Quiet) digunakan untuk menghilangkan warning agar log bersih
        # --parallel dan --build-cache untuk kecepatan maksimal
        run: cd android && ./gradlew assembleRelease --parallel --build-cache -q

      - name: 🚀 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AdiTV-Release-APK
          path: android/app/build/outputs/apk/release/app-release.apk
