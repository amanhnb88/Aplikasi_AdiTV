name: Build Android APK (Turbo)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn' # Mengaktifkan cache Yarn

      - name: ☕ Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle' # Mengaktifkan sistem Cache Gradle tingkat lanjut

      - name: 📦 Install Dependencies (Yarn)
        run: yarn install

      - name: ⚡ Aktifkan Gradle Configuration Cache (Sesuai Docs!)
        run: echo "org.gradle.configuration-cache=true" >> android/gradle.properties

      - name: 🔓 Make Gradlew Executable
        run: cd android && chmod +x ./gradlew

      - name: 🛠️ Build Release APK (Parallel & Cache)
        # Menambahkan flag --parallel dan --build-cache agar prosesnya secepat kilat
        run: cd android && ./gradlew assembleRelease --parallel --build-cache

      - name: 🚀 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AdiTV-Release-APK
          path: android/app/build/outputs/apk/release/app-release.apk
